{% extends "base.html" %}
{% from "_t24.html" import time24 %}
{% block back %}<a href="{{ url_for('courses') }}">← חזרה</a>{% endblock %}
{% block content %}
<div class="card">
  <h1>יצירת קורס קבוע</h1>
  <form method="post">
    <label>שם הקורס</label><input name="name" value="{{ form.name }}" required autofocus>
    <label>יום הקורס</label>
    <select name="day">
      {% for d in days %}<option{{ ' selected' if d == form.day }}>{{ d }}</option>{% endfor %}
    </select>
    <label>שעת התחלה</label>{{ time24('time', form.time) }}
    <label>שעת סיום</label>{{ time24('end_time', form.end_time) }}
    <button type="submit">יצירת קורס</button>
  </form>
</div>
{% endblock %}
