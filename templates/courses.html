{% extends "base.html" %}
{% block content %}
<h1>הקורסים שלי</h1>
{% for c in courses %}
  <a class="btn" href="{{ url_for('course_home', cid=c.id) }}">{{ c.name }}<br><small>יום {{ c.day }} · {{ c.time }}</small></a>
{% else %}
  <div class="card muted">אין קורסים עדיין.</div>
{% endfor %}
{% if g.user.role == 'teacher' %}
  <a class="btn green" href="{{ url_for('course_new') }}">＋ יצירת קורס חדש</a>
{% else %}
  <a class="btn green" href="{{ url_for('join') }}">להצטרף לקורס</a>
{% endif %}
{% endblock %}
